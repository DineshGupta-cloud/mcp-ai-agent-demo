server.port=8080

spring.application.name=mcp-server
spring.ai.mcp.server.name=business-tools-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# In-memory H2 database for robust unit & integration tests
spring.datasource.url=jdbc:h2:mem:mcp_demo;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
