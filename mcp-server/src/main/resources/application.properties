server.port=8080

spring.application.name=mcp-server
spring.ai.mcp.server.name=business-tools-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# MySQL Database configuration via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mcp_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.example.mcpserver=DEBUG
logging.level.org.springframework.ai.mcp=INFO
logging.level.org.hibernate=WARN
