server.port=8081

spring.application.name=ai-agent

# OpenRouter / OpenAI-compatible configuration
# Get your free key at https://openrouter.ai/keys
# Set via environment variable: OPENROUTER_API_KEY (or OPENAI_API_KEY)
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:${OPENAI_API_KEY:mock-key-for-test}}

# Free model supporting tool calling on OpenRouter:
# Option 1 (Default): openrouter/free (Auto-routes to the best available free model with tool-calling support)
# Option 2: deepseek/deepseek-chat:free
# Option 3: meta-llama/llama-3.3-70b-instruct:free
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/free}

# MCP Client configuration (Streamable HTTP)
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.business-tools.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.business-tools.endpoint=/mcp

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.example.aiagent=DEBUG
logging.level.org.springframework.ai=INFO
logging.level.io.modelcontextprotocol=INFO
